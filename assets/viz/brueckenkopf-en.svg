<text x="521.0" y="452" text-anchor="middle" font-size="11" fill="var(--ink2)">15</text>
<line x1="554.8" y1="72" x2="554.8" y2="430" stroke="var(--line)"/>
<line x1="588.7" y1="72" x2="588.7" y2="430" stroke="var(--line)"/>
<text x="588.7" y="452" text-anchor="middle" font-size="11" fill="var(--ink2)">17</text>
