<line x1="690.3" y1="72" x2="690.3" y2="430" stroke="var(--line)"/>
<line x1="724.2" y1="72" x2="724.2" y2="430" stroke="var(--line)"/>
<text x="724.2" y="452" text-anchor="middle" font-size="11" fill="var(--ink2)">21</text>
<line x1="758.1" y1="72" x2="758.1" y2="430" stroke="var(--line)"/>
<line x1="791.9" y1="72" x2="791.9" y2="430" stroke="var(--line)"/>
