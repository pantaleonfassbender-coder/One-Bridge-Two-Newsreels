<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="bk-t bk-d" font-family="var(--serif)">
<title id="bk-t">Ways across the Rhine</title><desc id="bk-d">A chart of the crossings at Remagen from 7 to 25 March 1945 after MacDonald. The Ludendorff Bridge is in use from the evening of 7 March, closed for repairs from 13 March and collapses on 17 March. Ponton ferries run from 9 March, amphibious trucks from 14 March. The treadway bridge from Remagen to Erpel is built from 10 March and opened on 11 March; a heavy ponton bridge at Linz opens at midnight on 11 March. Three VII Corps bridges open on 17, 19 and 21 March, a Bailey bridge on 20 March. Below: the crossing on 7 March, the limit of a thousand yards a day on 9 March, Eisenhower's directive on 13 March, the collapse on 17 March, the Sieg on 21 March, the German counterattack on 24 March and the breakout on 25 March.</desc>
<defs><pattern id="bk-h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="8" stroke="var(--bruecke)" stroke-width="3"/></pattern></defs>
