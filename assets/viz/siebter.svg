<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="sb-t sb-d" font-family="var(--serif)">
<title id="sb-t">Die Stunden des 7. März 1945</title><desc id="sb-d">Eine Zeitleiste von 8 bis 21 Uhr am 7. März 1945 in drei Bahnen. Amerikaner nach MacDonald: Aufbruch in Meckenheim um 8.20 Uhr, vor Mittag der Wald, kurz vor 13 Uhr sieht Burrows die Brücke, um 15.15 Uhr die Meldung aus Sinzig, gegen 16 Uhr an der Brücke, Drabik drüben, um 16.30 Uhr der Anruf beim Korps, um 18.45 Uhr die Genehmigung, gegen 20.15 Uhr wird der Ahr-Auftrag aufgehoben. Deutsche nach MacDonald: um 11.15 Uhr übernimmt Scheller, gegen 16 Uhr die Sperrladung, die Sprengung hebt die Brücke, die Übergabe im Tunnel. Engeman im Film: gegen Mittag auf dem Hügel, gegen halb vier geht die Infanterie hinüber, Meldung, um vier Uhr werde gesprengt.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Die Stunden des 7. März 1945</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Punkte: Zeiten, die die Quelle nennt; Ringe: erschlossen. Die Bahn Engeman ist Erinnerung, nach dem Ereignis aufgenommen.</text>
<text x="600.0" y="92" text-anchor="middle" font-size="11" fill="var(--ink2)">15–17 Uhr gedehnt</text>
