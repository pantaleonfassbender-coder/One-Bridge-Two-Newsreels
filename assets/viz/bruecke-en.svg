<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="br-t br-d" font-family="var(--serif)">
<title id="br-t">The life of the bridge</title><desc id="br-d">A timeline from 1916 to 1945. Built during the First World War; named after Ludendorff in May 1918; dedicated in August 1918; opened to pedestrians on 10 November 1918; the 7th Army returns across it at the end of November 1918; a guard stands on it under occupation until December 1925; the decking burns in March 1928 and is replaced by iron plates by November 1928; in 1935 only a few trains use it; in 1938 a demolition scheme is prepared; from 1940 Allied air raids; at the end of 1944 it is closed for fifteen days; on 7 March 1945 it is captured.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">The life of the bridge</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">1916–1945, after the newspapers of the time and MacDonald; 1916–1920 stretched.</text>
