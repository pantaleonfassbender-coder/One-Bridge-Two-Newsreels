<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="br-t br-d" font-family="var(--serif)">
<title id="br-t">Das Leben der Brücke</title><desc id="br-d">Eine Zeitleiste von 1916 bis 1945. Im Ersten Weltkrieg gebaut; im Mai 1918 nach Ludendorff benannt; im August 1918 eingeweiht; am 10. November 1918 für Fußgänger freigegeben; Ende November 1918 marschiert die 7. Armee über sie zurück; unter Besatzung steht bis Dezember 1925 eine Wache auf ihr; im März 1928 brennt der Belag und wird bis November 1928 durch Eisenplatten ersetzt; 1935 fahren nur wenige Züge; 1938 wird ein Sprengplan vorbereitet; ab 1940 alliierte Luftangriffe; Ende 1944 fünfzehn Tage gesperrt; am 7. März 1945 genommen.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Das Leben der Brücke</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">1916–1945, nach den Zeitungen der Zeit und MacDonald; 1916–1920 gedehnt.</text>
