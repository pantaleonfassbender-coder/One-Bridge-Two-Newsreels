<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="bk-t bk-d" font-family="var(--serif)">
<title id="bk-t">Wege über den Rhein</title><desc id="bk-d">Ein Schema der Übergänge bei Remagen vom 7. bis 25. März 1945 nach MacDonald. Die Ludendorff-Brücke ist ab dem Abend des 7. März in Betrieb, ab dem 13. März zur Ausbesserung gesperrt und stürzt am 17. März ein. Fähren aus Pontons fahren ab dem 9. März, Schwimmlastwagen ab dem 14. März. Die Pontonbrücke Remagen–Erpel wird ab dem 10. März gebaut und am 11. März eröffnet; eine schwere Pontonbrücke bei Linz um Mitternacht am 11. März. Drei Brücken des VII. Korps werden am 17., 19. und 21. März fertig, eine Bailey-Brücke am 20. März. Unten: der Übergang am 7. März, die Auflage von tausend Yards am Tag am 9. März, Eisenhowers Weisung am 13. März, der Einsturz am 17. März, die Sieg am 21. März, der deutsche Gegenangriff am 24. März und der Ausbruch am 25. März.</desc>
