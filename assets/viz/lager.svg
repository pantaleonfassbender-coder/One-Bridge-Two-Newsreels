<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="la-t la-d" font-family="var(--serif)">
<title id="la-t">Zu viele, zu wenig Wasser, zu viele Tote</title><desc id="la-d">Links: Die Lager Remagen und Sinzig waren für je 100 000 Gefangene gebaut. In Remagen lagen nach dem Bericht von 1969 184 000 (ohne Datum), nach der Landeszentrale 170 000 am 2. Mai 1945; in Sinzig nach dem Bericht 116 000 am 12. Mai 1945, nach der Landeszentrale höchstens 118 000. Rechts: In den sechs Wochen bis zum 15. Juni 1945 starben in allen Lagern der ADSEC 2 754 Gefangene an Krankheiten, 833 davon an Durchfall und Ruhr; die Sterberate durch Krankheit lag bei 34,2 auf 1 000 Gefangene im Jahr gegen 0,6 bei den US-Truppen. Nach der Forschung starben in Remagen und Sinzig über die ganze Zeit etwa 1 200 Menschen.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Zu viele, zu wenig Wasser, zu viele Tote</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Gestrichelt: neuere Literatur, nur referiert. Die Totenzahlen rechts gelten für verschiedene Räume und Zeiten.</text>
<a href="#/text/lager/rhein/1"><text x="20" y="86" font-size="14" font-weight="bold" fill="var(--ink)" text-decoration="underline">Belegung</text></a>
<line x1="210" y1="104" x2="210" y2="304" stroke="var(--ink2)" stroke-dasharray="3 3"/>
<text x="216" y="100" font-size="11.5" fill="var(--ink2)">Sollbelegung 100 000</text>
<text x="20" y="114" font-size="13" font-weight="bold" fill="var(--menschen)">Remagen (A2)</text>
<rect x="20" y="122" width="350" height="24" rx="3" fill="var(--menschen)"/>
<text x="26" y="139" font-size="12.5" font-weight="bold" fill="#fff">184 000</text>
<a href="#/text/lager/rhein/4"><text x="92" y="139" font-size="11.5" fill="#fff" text-decoration="underline">Bericht 1969, ohne Datum</text></a>
<rect x="20" y="154" width="323" height="24" rx="3" fill="var(--panel)" stroke="var(--menschen)" stroke-width="2" stroke-dasharray="5 3"/>
<text x="26" y="171" font-size="12.5" font-weight="bold" fill="var(--menschen)">170 000</text>
<a href="#/text/lager/graeber/13"><text x="92" y="171" font-size="11.5" fill="var(--ink)" text-decoration="underline">2. Mai, nach LpB RLP</text></a>
<text x="20" y="214" font-size="13" font-weight="bold" fill="var(--menschen)">Sinzig (A5)</text>
<rect x="20" y="222" width="220" height="24" rx="3" fill="var(--menschen)"/>
<text x="26" y="239" font-size="12.5" font-weight="bold" fill="#fff">116 000</text>
<a href="#/text/lager/rhein/3"><text x="92" y="239" font-size="11.5" fill="#fff" text-decoration="underline">12. Mai, Bericht 1969</text></a>
<rect x="20" y="254" width="224" height="24" rx="3" fill="var(--panel)" stroke="var(--menschen)" stroke-width="2" stroke-dasharray="5 3"/>
<text x="26" y="271" font-size="12.5" font-weight="bold" fill="var(--menschen)">118 000</text>
<a href="#/text/lager/graeber/13"><text x="92" y="271" font-size="11.5" fill="var(--ink)" text-decoration="underline">höchstens, nach LpB RLP</text></a>
<a href="#/text/lager/rhein/1"><text x="20" y="316" font-size="11.5" fill="var(--ink)" text-decoration="underline">17 Lager am Rhein: 1 095 000 Plätze für rund 1,5 Millionen Erwartete</text></a>
<a href="#/text/lager/krankheit/10"><text x="480" y="86" font-size="14" font-weight="bold" fill="var(--ink)" text-decoration="underline">Tote durch Krankheit</text></a>
<text x="480" y="104" font-size="11.5" fill="var(--ink2)">alle Lager der ADSEC, sechs Wochen bis 15. Juni 1945</text>
<rect x="480" y="114" width="360" height="26" rx="3" fill="var(--film)"/>
<rect x="480" y="114" width="109" height="26" rx="3" fill="var(--bruecke)"/>
<a href="#/text/lager/krankheit/11"><text x="486" y="132" font-size="12" fill="#fff" text-decoration="underline">833 Ruhr</text></a>
<a href="#/text/lager/krankheit/10"><text x="597" y="132" font-size="12.5" font-weight="bold" fill="#fff" text-decoration="underline">2 754 insgesamt</text></a>
<a href="#/text/lager/graeber/13"><text x="480" y="170" font-size="11.5" fill="var(--ink2)" text-decoration="underline">Remagen und Sinzig, ganze Zeit, nach der Forschung</text></a>
<rect x="480" y="180" width="157" height="26" rx="3" fill="none" stroke="var(--film)" stroke-width="2" stroke-dasharray="5 3"/>
<text x="486" y="198" font-size="12.5" font-weight="bold" fill="var(--film)">≈ 1 200</text>
<a href="#/text/lager/krankheit/10"><text x="480" y="250" font-size="14" font-weight="bold" fill="var(--ink)" text-decoration="underline">Sterberate durch Krankheit</text></a>
<text x="480" y="268" font-size="11.5" fill="var(--ink2)">auf 1 000 im Jahr, dieselben sechs Wochen</text>
<rect x="480" y="280" width="360" height="26" rx="3" fill="var(--menschen)"/>
<text x="486" y="298" font-size="12.5" font-weight="bold" fill="#fff">34,2  deutsche Gefangene</text>
<rect x="480" y="316" width="6" height="26" rx="3" fill="var(--us)"/>
<text x="492" y="334" font-size="12.5" font-weight="bold" fill="var(--ink)">0,6  US-Truppen</text>
<a href="#/text/lager/krankheit/9"><text x="480" y="360" font-size="11.5" fill="var(--ink)" text-decoration="underline">Der Bericht: seine Zahlen zählen Lazarettaufnahmen</text></a>
<a href="#/text/lager/krankheit/9"><text x="480" y="376" font-size="11.5" fill="var(--ink)" text-decoration="underline">und untertreiben die Krankheit in den Lagern.</text></a>
<a href="#/text/lager/krankheit/12"><text x="480" y="404" font-size="11.5" fill="var(--ink)" text-decoration="underline">Erstes Fleckfieber unter deutschen Gefangenen: März 1945, in Remagen.</text></a>
</svg>