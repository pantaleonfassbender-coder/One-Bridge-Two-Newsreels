<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="wa-t wa-d" font-family="var(--serif)">
<title id="wa-t">Wer befahl an der Brücke?</title><desc id="wa-d">Ein Schema der Befehlswege an der Brücke von Remagen am 7. März 1945 nach MacDonald. Über der 15. Armee unter von Zangen die Heeresgruppe B unter Model, darunter das LXVII. Korps unter Hitzfeld, das Major Scheller schickte, der ab 11.15 Uhr befahl. General Botsch, der 15. Armee unterstellt, ging am 6. März um 17 Uhr; Bonn unter von Bothmer. Hauptmann Bratge, Kampfkommandant, versuchte vergeblich, die Heeresgruppe B und Botsch zu erreichen, und gab den Befehl an Scheller ab. Hauptmann Friesenhahn, Brückenkommandant, war an den OKW-Befehl gebunden, der den Sprengbefehl schriftlich verlangte. Die Flak unterstand der Luftwaffe, der Volkssturm Funktionären der NSDAP, beide nicht Bratge.</desc><defs>
<marker id="ar-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker>
<marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--film)"/></marker>
<marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bruecke)"/></marker>
</defs>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Wer befahl an der Brücke?</text>
<text x="16" y="50" font-size="13" fill="var(--ink2)">7. März 1945, nach MacDonald. Durchgezogen: Unterstellung; gestrichelt: versuchte Verbindung, gescheitert; gepunktet: Befehl wirkt auf.</text>
