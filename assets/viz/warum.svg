<line x1="250" y1="455" x2="228" y2="455" stroke="var(--bruecke)" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ar-o)"/>
<polyline points="280,430 280,105 228,105" fill="none" stroke="var(--film)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-d)"/>
<polyline points="384,430 384,240" fill="none" stroke="var(--film)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-d)"/>
<polyline points="144,480 144,492 524,492 524,480" fill="none" stroke="var(--bruecke)" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ar-o)"/>
