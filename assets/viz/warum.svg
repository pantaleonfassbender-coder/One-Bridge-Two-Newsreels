<a href="#/text/warum/befehle/1"><rect x="440" y="430" width="168" height="50" rx="8" fill="var(--panel)" stroke="var(--bruecke)" stroke-width="2"/><text x="524.0" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--ink)" text-decoration="underline">Friesenhahn</text><text x="524.0" y="469" text-anchor="middle" font-size="12" fill="var(--ink2)">Brückenkommandant</text></a>
