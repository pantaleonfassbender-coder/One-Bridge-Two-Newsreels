<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="wa-t wa-d" font-family="var(--serif)">
<title id="wa-t">Who commanded at the bridge?</title><desc id="wa-d">A chart of command at the Remagen bridge on 7 March 1945 after MacDonald. Army Group B under Model above the Fifteenth Army under von Zangen, above the LXVII Corps under Hitzfeld, which sent Major Scheller, in command from 1115. General Botsch, under the Fifteenth Army, left on 6 March at 1700; Bonn under von Bothmer. Captain Bratge, combat commander, tried and failed to reach Army Group B and Botsch, and handed command to Scheller. Captain Friesenhahn, bridge commander, was bound by the OKW order requiring written demolition orders. Antiaircraft troops answered to the Luftwaffe, the Volkssturm to Nazi party officials, neither to Bratge.</desc><defs>
<marker id="ar-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker>
<marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--film)"/></marker>
<marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bruecke)"/></marker>
</defs>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Who commanded at the bridge?</text>
<text x="16" y="50" font-size="13" fill="var(--ink2)">7 March 1945, after MacDonald. Solid: subordination; dashed: contact attempted and failed; dotted: order acting on.</text>
