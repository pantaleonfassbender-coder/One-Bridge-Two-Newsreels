<a href="#/text/warum/sprengplan/10"><rect x="730" y="300" width="168" height="50" rx="8" fill="var(--panel)" stroke="var(--bruecke)" stroke-width="2"/><text x="814.0" y="321" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--ink)" text-decoration="underline">OKW order</text><text x="814.0" y="339" text-anchor="middle" font-size="12" fill="var(--ink2)">in writing, late</text></a>
