<line x1="300" y1="215" x2="228" y2="215" stroke="var(--ink2)" stroke-width="2" marker-end="url(#ar-s)"/>
<line x1="624" y1="300" x2="624" y2="130" stroke="var(--ink2)" stroke-width="2" marker-end="url(#ar-s)"/>
<line x1="814" y1="190" x2="814" y2="130" stroke="var(--ink2)" stroke-width="2" marker-end="url(#ar-s)"/>
<line x1="814" y1="350" x2="524" y2="430" stroke="var(--bruecke)" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ar-o)"/>
<line x1="250" y1="455" x2="228" y2="455" stroke="var(--bruecke)" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ar-o)"/>
