<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="sb-t sb-d" font-family="var(--serif)">
<title id="sb-t">The hours of 7 March 1945</title><desc id="sb-d">A timeline from 8 a.m. to 9 p.m. on 7 March 1945 in three lanes. Americans after MacDonald: departure from Meckenheim at 0820, the woods before noon, Burrows sees the bridge shortly before 1300, a message from Sinzig at 1515, at the bridge around 1600, Drabik across, a call to corps at 1630, approval at 1845, the Ahr task lifted about 2015. Germans after MacDonald: Scheller takes command at 1115, the ditch charge, the demolition lifts the bridge, the surrender in the tunnel, all around 1600. Engeman in the film: about noon on the hill, about 3.30 the infantry crosses, a message that the bridge would be blown at 4 o'clock.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">The hours of 7 March 1945</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Dots: times given in the source; rings: inferred. The Engeman lane is memory, recorded after the event.</text>
