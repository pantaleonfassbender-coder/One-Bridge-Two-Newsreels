<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="sg-t sg-d" font-family="var(--serif)">
<title id="sg-t">Was geschah, was gemeldet wurde</title><desc id="sg-d">Zwei Zeitleisten vom 7. bis 21. März 1945. Oben: Am 7. März wird die Brücke genommen; am 9. März setzt Hitler fliegende Standgerichte ein; am 10. März übernimmt Kesselring den Befehl im Westen; am 13. und 14. März werden vier Offiziere bei Rimbach erschossen; am 17. März stürzt die Brücke ein; am 21. März wird Kesselrings Erlass einem Stab bekanntgegeben. Unten: Am 8. März meldet der Wehrmachtbericht amerikanische Panzerspitzen „bis Remagen“; am 9. März fehlt Remagen; am 11. März spricht das DNB von Kräften, die „über den Strom gesetzt“ sind, und der Wehrmachtbericht von „ihrem Brückenkopf“; am 18. März meldet der Wehrmachtbericht die Todesurteile und nennt dabei die Rheinbrücke bei Remagen. Zwischen dem 7. und dem 18. März wird die Brücke in den gefundenen Berichten nicht genannt.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Was geschah, was gemeldet wurde</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">7.–21. März 1945. Oben: Ereignisse nach MacDonald und dem Bundesarchiv; unten: Wehrmachtbericht und DNB in den Zeitungen.</text>
