<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="wo-t wo-d" font-family="var(--serif)">
<title id="wo-t">Was die Kinos zeigten</title><desc id="wo-d">Eine Zeitleiste des März 1945. Ereignisse: Übergang am 7. März, Einsturz am 17. März, Todesurteile gemeldet am 18. März, eine Zeitung vom 20. März druckt den Empfang der Hitlerjungen über dem Einsturz von Remagen. Amerikanische und britische Wochenschauen: Universal und Movietone Nr. 825 am 26. März zeigen Remagen; undatiert: United News, Combat Bulletins 48 und 51, Pathé, Gaumont-British im Mai. Deutsche Wochenschau: Nr. 754 am 16. März nennt den Rhein, nicht Remagen; Nr. 755 am 22. März, die letzte, nichts aus dem Westen.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Was die Kinos zeigten</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">März 1945. Gefüllt: zeigt Remagen; leer: zeigt Remagen nicht. Undatierte Filme rechts.</text>
<line x1="200.0" y1="80" x2="200.0" y2="370" stroke="var(--line)"/>
