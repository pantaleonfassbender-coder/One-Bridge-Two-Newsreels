<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="sg-t sg-d" font-family="var(--serif)">
<title id="sg-t">What happened, what was reported</title><desc id="sg-d">Two timelines from 7 to 21 March 1945. Above: the bridge is taken on 7 March; on 9 March Hitler sets up flying courts-martial; on 10 March Kesselring takes command in the west; on 13 and 14 March four officers are shot near Rimbach; on 17 March the bridge collapses; on 21 March Kesselring's decree is made known to a staff. Below: on 8 March the Wehrmacht report has American spearheads ‘as far as Remagen’; on 9 March Remagen is missing; on 11 March the DNB speaks of forces that ‘crossed the river’ and the Wehrmacht report of ‘their bridgehead’; on 18 March the Wehrmacht report announces the death sentences and names the Rhine bridge at Remagen. Between 7 and 18 March the bridge is not named in the reports found.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">What happened, what was reported</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">7–21 March 1945. Above: events after MacDonald and the Bundesarchiv; below: Wehrmacht report and DNB in the newspapers.</text>
